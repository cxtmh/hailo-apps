<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLM Flask App - Vision Language Model</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .video-section h2,
        .chat-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.error {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-section {
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            overflow-y: auto;
            min-height: 300px;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: 40px;
            text-align: right;
        }

        .message.assistant {
            background: #e3f2fd;
            color: #333;
            margin-right: 40px;
        }

        .message.status {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-style: italic;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .timestamp {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        #promptInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        #promptInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #promptInput:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .connection-info {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #4caf50;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .connection-info.disconnected {
            color: #f44336;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 15px;
                gap: 20px;
            }

            .input-section {
                flex-direction: column;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: currentColor;
            margin-right: 4px;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .loading-spinner:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-spinner:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="connection-info" id="connectionInfo">
        ● Connecting...
    </div>

    <div class="container">
        <!-- Video Section -->
        <div class="video-section">
            <h2>📹 Camera Feed</h2>
            <div class="video-container">
                <div class="canvas-wrapper">
                    <img id="video" src="/video" alt="Video stream" style="width: 100%; height: 100%; object-fit: cover;">
                    <div class="status-indicator"></div>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="chat-section">
            <h2>💬 VLM Assistant</h2>
            <div class="chat-container" id="chatContainer">
                <div class="message status">Welcome to VLM Flask App! Ask questions about the camera feed.</div>
            </div>

            <div class="input-section">
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Ask a question about the camera feed..."
                    autocomplete="off"
                >
                <button id="sendButton" onclick="sendPrompt()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let isProcessing = false;

        // Connection status
        socket.on('connect', () => {
            console.log('Connected to server');
            document.getElementById('connectionInfo').textContent = '● Connected';
            document.getElementById('connectionInfo').classList.remove('disconnected');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            document.getElementById('connectionInfo').textContent = '● Disconnected';
            document.getElementById('connectionInfo').classList.add('disconnected');
        });

        // Handle status updates
        socket.on('status', (data) => {
            console.log('Status:', data.message);
            addMessage(data.message, 'status');
        });

        // Handle results
        socket.on('result', (data) => {
            console.log('Result:', data);
            isProcessing = false;
            updateUI();
            addMessage(`${data.answer}\n\n⏱️ ${data.time}`, 'assistant');
        });

        // Handle errors
        socket.on('error', (data) => {
            console.error('Error:', data.message);
            isProcessing = false;
            updateUI();
            addMessage(`❌ ${data.message}`, 'error');
        });

        // Send prompt function
        function sendPrompt() {
            const input = document.getElementById('promptInput');
            const prompt = input.value.trim();

            if (!prompt) {
                alert('Please enter a question');
                return;
            }

            if (isProcessing) {
                alert('Please wait for the current request to complete');
                return;
            }

            // Add user message to chat
            addMessage(prompt, 'user');
            input.value = '';

            // Send via WebSocket
            isProcessing = true;
            updateUI();
            socket.emit('ask', { prompt: prompt });
        }

        // Allow Enter key to send
        document.getElementById('promptInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendPrompt();
            }
        });

        // Add message to chat
        function addMessage(text, type) {
            const chatContainer = document.getElementById('chatContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;

            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            message.innerHTML = `
                <div>${text.replace(/\n/g, '<br>')}</div>
                <div class="timestamp">${timestamp}</div>
            `;

            chatContainer.appendChild(message);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Update UI based on processing state
        function updateUI() {
            document.getElementById('promptInput').disabled = isProcessing;
            document.getElementById('sendButton').disabled = isProcessing;
            document.getElementById('sendButton').textContent = isProcessing ? 'Processing...' : 'Send';
        }

        // Initial UI setup
        updateUI();
    </script>
</body>
</html>
